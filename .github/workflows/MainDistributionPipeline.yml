#
# This workflow calls the main distribution pipeline from DuckDB to build and test the extension binaries,
# then proves the windows_amd64 build in the official DuckDB CLI of the submodule's release on a real Windows runner and, on
# main and v2.0-cyanoptera, publishes it as a GitHub release asset with its SHA-256.
#
# windows_amd64_mingw is excluded: it is the wrong ABI for the official (MSVC) CLI.
# The upstream deploy job (duckdb-latest-deploy) was removed: it uploads to DuckDB's own S3 bucket with
# secrets that only exist in the duckdb organisation, so it can never succeed on this fork.
#
name: Main Extension Distribution Pipeline
on:
  pull_request:
    branches:
      - main
      - v2.0-cyanoptera
    paths-ignore:
      - '**/README.md'
      - 'doc/**'
  push:
    branches:
      - main
      - v2.0-cyanoptera
    paths-ignore:
      - '**/README.md'
      - 'doc/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  pins:
    # The DuckDB version is derived from the duckdb/ submodule, never typed: the submodule must be an official
    # release tag (an extension only loads in the exact DuckDB it was built for), and that release must ship a
    # Windows x64 CLI. Moving to a new DuckDB release (e.g. v2.0.1) = moving the submodule (scripts/rebuild.sh v2.0.1).
    name: DuckDB version and official CLI
    runs-on: ubuntu-latest
    outputs:
      duckdb_version: ${{ steps.pin.outputs.duckdb_version }}
      cli_asset: ${{ steps.pin.outputs.cli_asset }}
      cli_sha256: ${{ steps.pin.outputs.cli_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sub="$(git ls-tree HEAD duckdb | awk '{print $3}')"
          tag="$(git ls-remote --tags https://github.com/duckdb/duckdb.git 'refs/tags/v*' \
                 | awk -v s="$sub" '$1 == s {print $2}' | sed -e 's|^refs/tags/||' -e 's|\^{}$||' \
                 | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -z "$tag" ]; then
            echo "::error::duckdb/ submodule $sub is not an official DuckDB release tag: no official CLI can load this build"
            exit 1
          fi
          asset="$(gh api "repos/duckdb/duckdb/releases/tags/$tag" --jq '.assets[] | select(.name == "duckdb-cli-windows-amd64.tar.gz" or .name == "duckdb_cli-windows-amd64.zip") | .name + " " + .digest' | head -n 1)"
          if [ -z "$asset" ]; then
            echo "::error::DuckDB $tag has no official Windows x64 CLI asset"
            exit 1
          fi
          echo "DuckDB $tag (submodule $sub), Windows CLI: $asset"
          echo "duckdb_version=$tag" >> "$GITHUB_OUTPUT"
          echo "cli_asset=${asset%% *}" >> "$GITHUB_OUTPUT"
          echo "cli_sha256=${asset##*sha256:}" >> "$GITHUB_OUTPUT"

  duckdb-latest-build:
    name: Build extension binaries
    needs: pins
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@969bc76276acec1c0a3922ff500d2ec3a1a3b037 # v2.0-cyanoptera 2026-10-01 pin
    with:
      # The release tag, not its commit: DuckDB stamps the extension with this ref, and the official CLI refuses a
      # build stamped with a commit hash ("built specifically for DuckDB version d54cbbe3...").
      duckdb_version: ${{ needs.pins.outputs.duckdb_version }}
      ci_tools_version: 969bc76276acec1c0a3922ff500d2ec3a1a3b037 # v2.0-cyanoptera 2026-10-01 pin
      extension_name: spatial
      vcpkg_commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24
      exclude_archs: 'linux_amd64_musl;windows_amd64_mingw'

  windows-smoke:
    name: Windows start-up test (official CLI)
    needs: [pins, duckdb-latest-build]
    # Runs as soon as the build workflow ends, whatever happened to the other targets (GitHub cancels macOS jobs it
    # cannot find a runner for): it needs only the windows_amd64 artifact, and fails if that is missing.
    if: ${{ !cancelled() && needs.pins.result == 'success' }}
    runs-on: windows-latest
    env:
      DUCKDB_VERSION: ${{ needs.pins.outputs.duckdb_version }}
      DUCKDB_CLI_WINDOWS_ASSET: ${{ needs.pins.outputs.cli_asset }}
      DUCKDB_CLI_WINDOWS_SHA256: ${{ needs.pins.outputs.cli_sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the windows_amd64 extension
        uses: actions/download-artifact@v4
        with:
          pattern: spatial-*-extension-windows_amd64
          merge-multiple: true
          path: artifact

      - name: Download the official DuckDB CLI of the same version
        shell: pwsh
        run: |
          $url = "https://github.com/duckdb/duckdb/releases/download/$env:DUCKDB_VERSION/$env:DUCKDB_CLI_WINDOWS_ASSET"
          Invoke-WebRequest -Uri $url -OutFile $env:DUCKDB_CLI_WINDOWS_ASSET
          $hash = (Get-FileHash $env:DUCKDB_CLI_WINDOWS_ASSET -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:DUCKDB_CLI_WINDOWS_SHA256) { throw "CLI archive SHA-256 $hash does not match the release digest $env:DUCKDB_CLI_WINDOWS_SHA256" }
          New-Item -ItemType Directory -Force cli | Out-Null
          tar -xf $env:DUCKDB_CLI_WINDOWS_ASSET -C cli
          if ($LASTEXITCODE -ne 0) { throw "could not extract $env:DUCKDB_CLI_WINDOWS_ASSET" }
          $exe = Get-ChildItem -Recurse cli -Filter duckdb.exe | Select-Object -First 1
          if (-not $exe) { throw "duckdb.exe not found in $env:DUCKDB_CLI_WINDOWS_ASSET" }
          Copy-Item $exe.FullName .\duckdb.exe
          .\duckdb.exe --version

      - name: Run the start-up test (LOAD, ST_ReadOSM, pgr_dijkstra, pgr_drivingDistance, ST_KNN)
        shell: pwsh
        run: |
          $ext = Get-ChildItem -Recurse artifact -Filter spatial.duckdb_extension | Select-Object -First 1
          if (-not $ext) { throw "spatial.duckdb_extension not found in the artifact" }
          Copy-Item $ext.FullName .\spatial.duckdb_extension
          $env:EXPECTED_DUCKDB_VERSION = $env:DUCKDB_VERSION
          .\duckdb.exe -no-agent -unsigned -bail -list -f test/smoke/startup.sql
          if ($LASTEXITCODE -ne 0) { throw "start-up test failed with exit code $LASTEXITCODE" }

  windows-release:
    name: Publish the windows_amd64 and linux_amd64 release assets
    needs: [pins, windows-smoke]
    env:
      DUCKDB_VERSION: ${{ needs.pins.outputs.duckdb_version }}
    if: ${{ !cancelled() && needs.windows-smoke.result == 'success' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v2.0-cyanoptera') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: windows-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download the windows_amd64 extension
        uses: actions/download-artifact@v4
        with:
          pattern: spatial-*-extension-windows_amd64
          merge-multiple: true
          path: artifact

      - name: Download the linux_amd64 extension
        uses: actions/download-artifact@v4
        with:
          pattern: spatial-*-extension-linux_amd64
          merge-multiple: true
          path: artifact-linux

      - name: Create the release with the extensions and their SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::8}"
          # Tag <duckdb version>-fork.<n>: reuse the tag already on this commit, else take the next free number.
          tag="$(git tag --points-at "$GITHUB_SHA" -l "${DUCKDB_VERSION}-fork.*" | sort -V | tail -n 1)"
          if [ -z "$tag" ]; then
            last="$(git tag -l "${DUCKDB_VERSION}-fork.*" | sed "s/^${DUCKDB_VERSION}-fork\.//" | grep -E '^[0-9]+$' | sort -n | tail -n 1)"
            tag="${DUCKDB_VERSION}-fork.$(( ${last:-0} + 1 ))"
          fi
          echo "release tag: $tag"
          mkdir -p release
          cp "$(find artifact -name spatial.duckdb_extension | head -n 1)" release/spatial.duckdb_extension
          (cd release && sha256sum spatial.duckdb_extension > spatial.duckdb_extension.sha256 && cat spatial.duckdb_extension.sha256)
          # Linux x64 (glibc, built and tested by the linux_amd64 job). DuckDB takes the extension name from the file name up
          # to its first dot, so spatial.linux_amd64.duckdb_extension loads as spatial.
          linux_ext="$(find artifact-linux -name spatial.duckdb_extension | head -n 1)"
          [ -n "$linux_ext" ] || { echo "::error::linux_amd64 spatial.duckdb_extension not found in the artifact"; exit 1; }
          cp "$linux_ext" release/spatial.linux_amd64.duckdb_extension
          (cd release && sha256sum spatial.linux_amd64.duckdb_extension > spatial.linux_amd64.duckdb_extension.sha256 && cat spatial.linux_amd64.duckdb_extension.sha256)
          # The README promises no Visual C++ Redistributable: hold the binary to it.
          if objdump -p release/spatial.duckdb_extension | grep -iE 'DLL Name: (vcruntime|msvcp|ucrtbase|api-ms-win-crt)'; then
            echo "::error::the extension imports the Visual C++ runtime; fix the static runtime or the README"; exit 1
          fi
          notes="Spatial extension for the official DuckDB ${DUCKDB_VERSION} CLI on Windows x64 (MSVC, windows_amd64), built from fork commit ${GITHUB_SHA}.

          Load it with \`duckdb -unsigned\`, then \`LOAD 'C:/path/to/spatial.duckdb_extension';\` (keep the file name: DuckDB derives the extension name from it).
          It only loads in DuckDB ${DUCKDB_VERSION}. No Visual C++ Redistributable needed: the C/C++ runtime is linked statically.
          SHA-256: $(cut -d' ' -f1 release/spatial.duckdb_extension.sha256)

          Linux x64 (glibc, linux_amd64): \`spatial.linux_amd64.duckdb_extension\`, \`LOAD '/path/to/spatial.linux_amd64.duckdb_extension';\` in \`duckdb -unsigned\` v${DUCKDB_VERSION}.
          SHA-256: $(cut -d' ' -f1 release/spatial.linux_amd64.duckdb_extension.sha256)

          Built, tested in the official CLI on windows-latest and published by run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          if gh release view "$tag" >/dev/null 2>&1; then
            # Never replace a published binary: its SHA-256 is already in use.
            echo "release $tag already exists for $GITHUB_SHA; nothing to publish"
          else
            gh release create "$tag" release/spatial.duckdb_extension release/spatial.duckdb_extension.sha256 \
              release/spatial.linux_amd64.duckdb_extension release/spatial.linux_amd64.duckdb_extension.sha256 \
              --target "$GITHUB_SHA" --title "spatial ${tag}: DuckDB ${DUCKDB_VERSION}, Windows x64 and Linux x64, fork commit ${short_sha}" \
              --notes "$notes"
          fi

  relassert:
    name: Build relassert
    runs-on: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-x64' || 'ubuntu-latest' }}
    env:
      GEN: ninja
      CC: clang-20
      CXX: clang++-20
      # Enable -DDEBUG slow verifiers (expression verifier, operator
      # round-trips, etc.) without changing the optimization level.
      FORCE_DEBUG: 1
      FORCE_ASSERT: 1
      ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:abort_on_error=0"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'
      - name: Install tools
        run: python3 duckdb/scripts/ci/retry.py -- make -C duckdb toolsci
      - name: Fix ASan runtime
        # libclang_rt.asan_static.a is missing in ubuntu 24.04 — workaround
        # mirrored from upstream Main.yml.
        run: |
          asan_static_dir="/usr/lib/llvm-20/lib/clang/20/lib/x86_64-pc-linux-gnu"
          asan_static_target="/usr/lib/llvm-20/lib/clang/20/lib/linux/libclang_rt.asan_static-x86_64.a"
          if [[ ! -e "${asan_static_dir}/libclang_rt.asan_static.a" && -e "${asan_static_target}" ]]; then
            sudo mkdir -p "${asan_static_dir}"
            sudo ln -sf "${asan_static_target}" "${asan_static_dir}/libclang_rt.asan_static.a"
          fi
      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          max-size: 5GB
          evict-old-files: job
      - name: Build (relassert → ASan + UBSan + LSan)
        uses: duckdb/duckdb-ci/build-duckdb@main
        with:
          build-type: relassert
          build: python3 duckdb/scripts/ci/retry.py -- make relassert
          test: make unittest_relassert
          vcpkg-commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24
